include:
  - docker-compose.infra.yml

services:

  api-tasks:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm --filter @orbit/api-tasks exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @orbit/api-tasks start:dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-tasks/node_modules
      - /app/node_modules/.bin

    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set; copy .env.example to .env}
      - JWT_EXPIRES_IN_SECONDS=${JWT_EXPIRES_IN_SECONDS:-3600}

  bff:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @orbit/bff dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api-tasks
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @orbit/web dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BFF_URL=http://localhost:3001
