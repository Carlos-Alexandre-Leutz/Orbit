include:
  - docker-compose.infra.yml

services:

  api-tasks:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm --filter @orbit/api-tasks exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @orbit/api-tasks exec prisma migrate deploy && pnpm --filter @orbit/api-tasks start:dev"
    # The mail settings (MAIL_PROVIDER, MAIL_API_*), APP_URL and the rest come from .env.
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-tasks/node_modules
      - /app/node_modules/.bin

    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set; copy .env.example to .env}
      - JWT_EXPIRES_IN_SECONDS=${JWT_EXPIRES_IN_SECONDS:-3600}

  bff:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @orbit/bff dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api-tasks
    env_file:
      - .env
    environment:
      # How the BFF reaches the API inside the Docker network (.env has the host address).
      - TASKS_API_URL=http://api-tasks:3002

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @orbit/web dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BFF_URL=http://localhost:3001
      - BFF_URL=http://bff:3001
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - BFF_PUBLIC_URL=${BFF_PUBLIC_URL:-http://localhost:3001}
      - ADMIN_PATH=${ADMIN_PATH:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
