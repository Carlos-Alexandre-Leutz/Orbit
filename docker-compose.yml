include:
  - docker-compose.infra.yml

services:

  api-tasks:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm --filter @orbit/api-tasks exec prisma migrate deploy && pnpm --filter @orbit/api-tasks start"
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bff:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @orbit/bff start
    ports:
      - "3001:3001"
    depends_on:
      api-tasks:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TASKS_API_URL=http://api-tasks:3002
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BFF_URL: http://127.0.0.1:3001
    command: pnpm --filter @orbit/web start
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
