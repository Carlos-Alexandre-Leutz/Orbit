version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: orbit-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  api-tasks:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter api-tasks start
    ports:
      - "3002:3002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  bff:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter bff start
    ports:
      - "3001:3001"
    depends_on:
      - api-tasks
    environment:
      - TASKS_API_URL=http://api-tasks:3002

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter web start
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BFF_URL=http://localhost:3001

volumes:
  postgres_data: