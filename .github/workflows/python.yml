name: python

on:
  pull_request:
    branches: [main, staging, 'pbi/**']

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ml/requirements*.txt

      - name: Install the ML service dependencies
        run: pip install -r services/ml/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check services/ml scripts tests

      - name: Test the ML service
        working-directory: services/ml
        run: pytest -q
