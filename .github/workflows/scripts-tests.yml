name: scripts-tests

on:
  pull_request:
    branches: [main, staging, 'pbi/**']

jobs:
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the repository scripts
        run: python -I -m unittest discover -s tests -p "test_*.py" -v
